use_default_settings: true

server:
  secret_key: "change-this-secret-key-before-public-deployment"
  bind_address: "0.0.0.0"
  port: 8080
  image_proxy: true

search:
  formats:
    - html
    - json
  safe_search: 1
  autocomplete: "duckduckgo"
  autocomplete_min: 2

outgoing:
  # Keep the metasearch responsive while still allowing multiple sources.
  request_timeout: 2.0
  max_request_timeout: 3.0
  pool_connections: 100
  enable_http2: true

engines:
  # General web search.
  - name: bing
    disabled: false
    timeout: 2.0

  # Match the fast general-search budget for the media/news tabs.
  - name: bing images
    disabled: false
    timeout: 2.0

  - name: bing videos
    disabled: false
    timeout: 2.0

  - name: bing news
    disabled: false
    timeout: 2.0

  # These were repeatedly timing out or returning CAPTCHA responses
  # during local testing, so disabling them keeps the UI responsive.
  - name: brave
    disabled: true
    timeout: 2.0

  - name: duckduckgo
    disabled: true
    timeout: 2.0

  # Not needed for normal web/image/video/news search.
  - name: ahmia
    disabled: true

  - name: torch
    disabled: true

valkey:
  url: valkey://valkey:6379/0
