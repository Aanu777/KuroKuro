use_default_settings: true

general:
  instance_name: "KUROKURO Search"
  debug: false
  enable_metrics: false

search:
  formats:
    - html
    - json
  safe_search: 1

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "replace-at-runtime-with-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false
  base_url: false

valkey:
  url: false
